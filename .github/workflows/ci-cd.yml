name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: devops-aks-demo

jobs:
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
      
      - name: Image digest
        run: |
          echo "Image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      
      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      
      - name: Deploy to AKS
        run: |
          # Substituir variáveis nos manifests
          export ACR_LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          export IMAGE_TAG="${{ steps.vars.outputs.short_sha }}"
          
          # Aplicar manifests com substituição de variáveis
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          
          # Aguardar rollout
          kubectl rollout status deployment/devops-aks-demo-deployment --timeout=5m
      
      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          kubectl get deployments -l app=devops-aks-demo
          kubectl get pods -l app=devops-aks-demo
          kubectl get services -l app=devops-aks-demo
      
      - name: Get service endpoint
        run: |
          echo "Waiting for external IP..."
          kubectl wait --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' \
            service/devops-aks-demo-service --timeout=3m || true
          
          EXTERNAL_IP=$(kubectl get service devops-aks-demo-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          if [ -n "$EXTERNAL_IP" ]; then
            echo "Application is accessible at: http://$EXTERNAL_IP"
          else
            echo "External IP not yet assigned. Check with: kubectl get service devops-aks-demo-service"
          fi
